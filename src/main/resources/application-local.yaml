spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/meal_planner_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true

server:
  port: 8081
  servlet:
    context-path: /api

# JWT (dùng secret đơn giản khi test local)
app:
  jwt:
    secret: 
    expiration-ms: 86400000        # 1 ngày
    refresh-expiration-ms: 604800000  # 7 ngày

