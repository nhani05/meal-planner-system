spring:
  config:
    activate:
      on-profile: ci

  datasource:
    url: jdbc:h2:mem:meal_planner_system;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false

server:
  port: 8081
  servlet:
    context-path: /api

app:
  jwt:
    secret: 
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
